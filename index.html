<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Modelo glTF</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            font-size: 14px;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="info">Visualizador 3D - Usa el ratón para rotar y hacer zoom</div>

    <!-- Importar Three.js y los controles de órbita mediante ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Configuración básica de la escena, cámara y renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Controles de órbita para mover la cámara con el ratón
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 4. Cargar el modelo glTF
        // Nota: Para cargar este JSON directamente como archivo, guárdalo con la extensión .gltf
        // o convierte el contenido en un Blob URL si prefieres inyectarlo desde memoria.
        const loader = new GLTFLoader();

        // Ejemplo usando los datos incrustados como un Blob (reemplaza esto si cargas un archivo externo)
        const gltfData = document.currentScript; // O puedes pasar el texto JSON directamente:
        const jsonString = `{...}`; // Aquí iría todo el contenido de tu JSON proporcionado

        const blob = new Blob([JSON.stringify(window.gltfJsonData || {})], { type: 'application/json' });
        // Como alternativa directa, si guardas el texto en un archivo local llamado "modelo.gltf":
        // loader.load('modelo.gltf', function (gltf) { ... });

        // Para fines prácticos en este HTML, te sugiero guardar el texto que pegaste en un archivo llamado `modelo.gltf` 
        // en la misma carpeta que este HTML y cambiar la ruta abajo:
        
        loader.load('modelo.gltf', (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            
            // Centrar la cámara o ajustar escala si es necesario
            console.log('Modelo cargado exitosamente', gltf);
        }, undefined, (error) => {
            console.error('Ocurrió un error al cargar el modelo:', error);
        });

        // 5. Bucle de animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 6. Ajustar la ventana si cambia de tamaño
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
